<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Studio · Animation</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262a33;--text:#e7e9ee;--muted:#8b93a3;--acc:#ffcc00;--ok:#3ecf8e;--warn:#f5a524;--bad:#e5484d}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:290px 1fr;grid-template-rows:auto 1fr;height:100vh}
  nav{grid-column:1/3;display:flex;gap:4px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  nav b{margin-right:18px}nav b span{color:var(--acc)}
  nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px}nav a.on{background:var(--acc);color:#111;font-weight:600}
  aside{border-right:1px solid var(--line);padding:18px;overflow:auto;background:var(--panel)}
  main{overflow:auto;padding:24px 32px 80px}
  h2{font-size:20px;margin:0}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
  textarea{min-height:70px;resize:vertical}
  button{background:var(--acc);color:#111;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .seg{display:flex;gap:6px}.seg button{flex:1}.seg button:not(.on){background:transparent;color:var(--muted);border:1px solid var(--line)}
  .plist{margin-top:22px;display:flex;flex-direction:column;gap:6px}
  .pitem{padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.pitem.on{border-color:var(--acc)}
  .pitem small{color:var(--muted);display:block}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
  .steps{display:flex;flex-direction:column;gap:14px;margin-top:16px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .step header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:13px}
  .step.done .num{background:var(--ok);color:#111}.step.next .num{background:var(--acc);color:#111}
  .step h3{margin:0;font-size:15px;flex:1}
  .muted{color:var(--muted)}
  .prompt{display:flex;gap:8px;margin-top:8px}
  .prompt code{flex:1;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font:12.5px ui-monospace,Menlo,monospace;color:var(--acc)}
  .doc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 16px;max-height:420px;overflow:auto;margin-top:8px}
  .doc h1,.doc h2,.doc h3{font-size:15px;margin:14px 0 6px;color:var(--acc)}.doc p{margin:6px 0}.doc ul{margin:4px 0;padding-left:20px}
  .doc table{border-collapse:collapse;font-size:12.5px}.doc td,.doc th{border:1px solid var(--line);padding:3px 6px;text-align:left}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px}
  .drop.over{border-color:var(--acc);color:var(--text)}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px;display:none}.bar i{display:block;height:100%;background:var(--acc);width:0}
  .chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
  .char{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
  .char h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}
  .line{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
  .line b{color:var(--acc);font-size:12px}
  .line audio{height:28px;width:100%;margin-top:4px}
  .score{font-size:11px}.score.ok{color:var(--ok)}.score.bad{color:var(--bad)}
  .arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px}
  .art{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
  .art .ptext{white-space:pre-wrap;font-size:12.5px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0}
  .art img{max-width:100%;border-radius:6px;margin-top:6px;display:block}
  video{max-width:100%;border-radius:10px;background:#000;display:block;margin-top:8px}
  .empty{display:grid;place-items:center;height:70vh;color:var(--muted);text-align:center}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ok);color:#111;padding:8px 14px;border-radius:8px;font-weight:600;display:none}
  a{color:var(--acc)}
</style>
</head>
<body>
<nav><b>🎬 Clip <span>Studio</span></b><a href="/">Clips</a><a href="/animation" class="on">Animation</a></nav>
<aside>
  <label>Story title</label>
  <input id="nTitle" placeholder="e.g. The Library That Never Burned">
  <label>Format</label>
  <div class="seg" id="nFormat"><button class="on" data-v="16:9">16:9 long</button><button data-v="9:16">9:16 short</button></div>
  <label>Idea / notes (optional)</label>
  <textarea id="nIdea" placeholder="What is the story about? Tone, length, audience… or paste a full script."></textarea>
  <button style="width:100%;margin-top:12px" onclick="createAnim()">+ New animated story</button>
  <div class="plist" id="plist"></div>
</aside>
<main id="main"><div class="empty">Create or pick an animated story on the left.</div></main>
<div class="toast" id="toast"></div>
<script>
const BASE = (location.protocol === "file:" || location.pathname.endsWith("/web/animation.html")) ? "http://localhost:8000" : "";
let list = [], cur = null, lastSig = "", clips = [], el = null;
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function copy(t){navigator.clipboard.writeText(t);toast("Copied")}
const copyBtn = (t, label="Copy") => `<button class="ghost" onclick="copy(clips[${clips.push(t)-1}])">${label}</button>`;
const promptBox = t => `<div class="prompt"><code>${esc(t)}</code>${copyBtn(t)}</div>`;
document.querySelectorAll(".seg").forEach(g => g.onclick = e => { if (e.target.tagName !== "BUTTON") return; g.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.target)); });

function md(src){
  if(!src) return "";
  let h = esc(src).replace(/```([\s\S]*?)```/g,(_,c)=>`<pre>${c}</pre>`)
    .replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/((?:^\|.*\|\s*$\n?)+)/gm, t => { const rows = t.trim().split("\n").filter(r => !/^\|[\s|:-]+\|$/.test(r));
        return "<table>" + rows.map((r,i) => "<tr>" + r.slice(1,-1).split("|").map(c => i ? `<td>${c.trim()}</td>` : `<th>${c.trim()}</th>`).join("") + "</tr>").join("") + "</table>"; })
    .replace(/^\s*[-*•] (.*)$/gm,"<li>$1</li>").replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  return h.split(/\n{2,}/).map(p=>/^<(h\d|ul|pre|table)/.test(p)?p:`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}
async function api(path, opts){ const r = await fetch(BASE + path, opts); const j = await r.json(); if (j.error) { alert(j.error); throw j.error; } return j; }

async function load(){
  try { list = await api("/api/anim/list"); } catch(e) { return; }
  const sig = JSON.stringify(list); if (sig === lastSig) return; lastSig = sig;
  $("#plist").innerHTML = list.map(a => `<div class="pitem ${a.name===cur?"on":""}" onclick="pick('${a.name}')"><b>${esc(a.title)}</b>
    <small><span class="tag">${a.format}</span><span class="tag">${a.lines.length} lines</span>${a.created||""}</small></div>`).join("");
  render();
}
function pick(n){ cur = n; lastSig = ""; load(); }
async function createAnim(){
  const title = $("#nTitle").value.trim(); if (!title) return alert("Give it a title");
  const a = await api("/api/anim/create", {method:"POST", body: JSON.stringify({title, format: $("#nFormat .on").dataset.v, idea: $("#nIdea").value})});
  $("#nTitle").value = ""; $("#nIdea").value = ""; cur = a.name; lastSig = ""; load();
}

function upload(kind, key, file){
  if (!file) return;
  const id = `bar-${kind}-${key}`.replace(/\W/g, "_"), bar = document.getElementById(id);
  if (bar) bar.style.display = "block";
  const x = new XMLHttpRequest();
  x.open("POST", BASE + `/api/anim/upload?anim=${encodeURIComponent(cur)}&kind=${kind}&key=${encodeURIComponent(key)}`);
  x.setRequestHeader("X-Filename", encodeURIComponent(file.name));
  x.upload.onprogress = e => { if (bar) bar.querySelector("i").style.width = (e.loaded / e.total * 100) + "%"; };
  x.onload = () => { const j = JSON.parse(x.responseText); if (j.error) alert(j.error); else toast("Uploaded " + file.name); lastSig = ""; load(); };
  x.send(file);
}
function dropZone(kind, key, accept, label){
  const id = `bar-${kind}-${key}`.replace(/\W/g, "_");
  return `<div class="drop" onclick="this.nextElementSibling.click()" ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');upload('${kind}',${JSON.stringify(key).replace(/"/g,"&quot;")},event.dataTransfer.files[0])">${label}</div>
    <input type="file" accept="${accept}" hidden onchange="upload('${kind}',${JSON.stringify(key).replace(/"/g,"&quot;")},this.files[0])">
    <div class="bar" id="${id}"><i></i></div>`;
}
// one box to copy several prompts at once (grouped by kind), e.g. all 6 backgrounds
function copyAllBox(a){
  const kinds = [...new Set(a.prompts.map(p => p.kind))];
  const label = {character: "character", background: "background", overlays: "overlay", props: "props", environment: "environment"};
  const pack = ps => ps.map((p, i) => `#${i + 1} ${p.name} (${p.id}), size: ${p.size || "16:9"}\n${p.prompt}`).join("\n\n----------\n\n");
  const btns = kinds.map(k => { const ps = a.prompts.filter(p => p.kind === k);
    const todo = ps.filter(p => !a.art[p.id]);
    return `${copyBtn(pack(ps), `📋 All ${ps.length} ${label[k] || k} prompt${ps.length > 1 ? "s" : ""}`)}
      ${todo.length && todo.length < ps.length ? copyBtn(pack(todo), `📋 Only the ${todo.length} not uploaded yet`) : ""}`; }).join("");
  const missing = a.prompts.filter(p => !a.art[p.id]);
  return `<div style="border:1px solid var(--acc);border-radius:10px;padding:12px;margin-top:12px;background:var(--bg)">
    <b>📦 Copy all prompts at once</b> <span class="muted">(each prompt is numbered and separated by a line)</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${btns}
      ${missing.length ? copyBtn(pack(missing), `⭐ Everything still missing (${missing.length})`) : ""}</div>
  </div>`;
}

const step = (n, title, state, body) => `<div class="step ${state}"><header><div class="num">${state==="done"?"✓":n}</div><h3>${title}</h3></header>${body}</div>`;

function render(){
  const a = list.find(x => x.name === cur);
  if (!a) { $("#main").innerHTML = `<div class="empty">Create or pick an animated story on the left.</div>`; return; }
  clips = [];
  const N = a.name;
  const chars = [...new Set(a.lines.map(l => l.character))];
  const allVoice = chars.length && chars.every(c => a.voice[c] || (c !== "Narrator" && el && el.configured));
  const allSplit = a.lines.length && a.lines.every(l => a.line_audio[l.id]);
  const allArt = a.prompts.length && a.prompts.every(p => a.art[p.id]);
  const allCut = allArt && a.prompts.every(p => a.art[p.id].preview);
  const has = {story: !!a.story && a.lines.length > 0, voice: allVoice && allSplit, art: allCut, out: a.outputs.length > 0};
  const order = ["story", "voice", "art", "out"], next = order.find(k => !has[k]);
  const st = k => has[k] ? "done" : (k === next ? "next" : "");

  // ---- voice lines grouped by character
  const charBox = c => {
    const ls = a.lines.filter(l => l.character === c), v = a.voice[c];
    const tts = c !== "Narrator" && el && el.configured;     // characters: ElevenLabs; narrator: your own recording
    const vid = (a.voices || {})[c] || "";
    const lineRow = (l, i) => { const sp = a.split[l.id], au = a.line_audio[l.id];
      return `<div class="line"><b>${i + 1}<br><span class="muted">${esc(l.id)}${l.shot ? "<br>shot " + l.shot : ""}</span></b><div>${esc(l.text)}
        ${sp && sp.error ? `<div class="score bad">⚠ ${esc(sp.error)}</div>` : ""}
        ${au ? `<audio controls preload="none" src="${BASE}${au}"></audio>
           <div class="score ${sp && sp.score < 0.7 ? "bad" : "ok"}">${sp ? (sp.source === "elevenlabs" ? `ElevenLabs ${sp.model === "eleven_v3" ? "v3 🎭" : (sp.model ? "v2 (no emotion tags)" : "v2 (no emotion tags)")} · ${sp.dur}s · ${sp.chars} chars${sp.model === "eleven_v3" ? "" : " · regenerate for emotions"}` : `${sp.dur}s · match ${Math.round(sp.score * 100)}%`) : ""}</div>` : ""}
        ${tts ? `<div class="muted" style="font-size:11px;margin-top:4px">How it's performed (emotion tags in [brackets], edit freely):</div>
          <textarea class="perf" rows="2" onchange="savePerf('${l.id}', this.value)"
            style="font:12px ui-monospace,Menlo,monospace;color:var(--acc);padding:5px 8px;margin-top:2px;min-height:0">${esc(l.performance || l.text)}</textarea>` : ""}
        ${tts ? `<div style="margin-top:4px"><button class="${au ? "ghost" : ""}" style="padding:4px 10px;font-size:12px" 
            onclick="ttsLine('${l.id}', ${(l.performance || l.text).length}, ${au ? "true" : "false"}, this, ${vid ? "true" : "false"}, ${JSON.stringify(c).replace(/"/g, "&quot;")})">${au ? "🔄 Regenerate" : "🎙️ Generate"} · ${(l.performance || l.text).length} chars</button></div>` : ""}
      </div></div>`; };
    if (tts) {
      const opts = (el.voices || []).map(x => `<option value="${x.id}" ${x.id === vid ? "selected" : ""}>${esc(x.name)}</option>`).join("");
      const pv = (el.voices || []).find(x => x.id === vid);
      const done = ls.filter(l => a.line_audio[l.id]).length;
      return `<div class="char"><h4>🤖 ${esc(c)} <span class="tag">${ls.length} line${ls.length > 1 ? "s" : ""}</span>
          <span class="tag" style="color:${done === ls.length ? "var(--ok)" : "var(--muted)"}">${done}/${ls.length} generated</span></h4>
        <div class="muted" style="font-size:12px">ElevenLabs voice. Nothing is generated until you click. Cost ≈ 1 credit per character.</div>
        ${vid ? "" : `<div style="color:var(--warn);font-size:12px;font-weight:600;margin-top:4px">① Choose a voice for ${esc(c)} first, then ② click Generate on a line.</div>`}
        <div style="display:flex;gap:8px;align-items:center;margin:6px 0">
          <select style="${vid ? "" : "border-color:var(--warn)"}" onchange="setVoice(${JSON.stringify(c).replace(/"/g, "&quot;")}, this.value)"><option value="">Choose a voice…</option>${opts}</select>
          ${pv && pv.preview ? `<button class="ghost" style="padding:6px 10px" onclick="new Audio('${pv.preview}').play()" title="Preview this voice (free)">▶</button>` : ""}
        </div>
        ${ls.map(lineRow).join("")}
      </div>`;
    }
    return `<div class="char"><h4>🎙️ ${esc(c)} <span class="tag">${ls.length} line${ls.length > 1 ? "s" : ""}</span>
        ${v ? `<span class="tag" style="color:var(--ok)">uploaded</span>` : ""}</h4>
      <div class="muted" style="font-size:12px">Your own recording: all lines <b>in this order</b> in one file, ~1 second pause between lines.</div>
      <div style="margin:6px 0">${copyBtn(ls.map(l => l.text).join("\n\n"), "📋 Copy " + esc(c) + "'s lines")}</div>
      ${ls.map(lineRow).join("")}
      ${v ? `<audio controls preload="none" src="${BASE}${v.url}?v=${v.v}" style="width:100%;margin-top:8px"></audio>` : ""}
      <div style="margin-top:8px">${dropZone("voice", c, "audio/*,video/*", v ? "🔄 Replace " + esc(c) + "'s recording" : "Drop " + esc(c) + "'s recording here (mp3 / wav / m4a)")}</div>
    </div>`;
  };

  // ---- art prompt cards
  const artBox = p => { const up = a.art[p.id];
    return `<div class="art"><div style="display:flex;gap:8px;align-items:center"><span class="tag">${esc(p.kind)}</span><b>${esc(p.name)}</b>
        <span class="muted" style="margin-left:auto">${esc(p.id)}</span></div>
      ${p.uses ? `<div class="muted" style="font-size:12px;margin-top:4px">Used in: ${esc(p.uses)}</div>` : ""}
      <div class="ptext">${esc(p.prompt)}</div>
      <div style="display:flex;gap:8px">${copyBtn(p.prompt, "📋 Copy prompt")}${p.size ? `<span class="muted" style="align-self:center">Size: ${esc(p.size)}</span>` : ""}</div>
      ${up ? `<a href="${BASE}${up.url}" target="_blank"><img src="${BASE}${up.url}?v=${up.v}"></a>
        ${up.full ? `<p style="margin:8px 0 0;color:var(--ok)">✅ Full background, used as-is (no cutting needed)</p>` : up.preview ? `<p class="muted" style="margin:8px 0 0">✂️ Cut into <b>${up.pieces}</b> pieces:</p><a href="${BASE}${up.preview}?v=${up.v}" target="_blank"><img src="${BASE}${up.preview}?v=${up.v}"></a>`
                     : `<p class="muted" style="margin:6px 0 0">Not cut yet. Ask Claude (step 3 prompt).</p>`}` : ""}
      <div style="margin-top:8px">${dropZone("art", p.id, "image/png,image/jpeg,image/webp", up ? "🔄 Replace image" : "Drop the generated image here")}</div>
    </div>`; };

  $("#main").innerHTML = `
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2>${esc(a.title)}</h2><span class="tag">${a.format}</span>
    <span class="muted">folder: animations/${N}/</span></div>
  ${a.idea ? `<p class="muted">Idea: ${esc(a.idea.slice(0, 300))}${a.idea.length > 300 ? "…" : ""}</p>` : ""}
  <div class="steps">
  ${step(1, "Story, script & shot list", st("story"),
    `${promptBox(`Write the story, script and shot list for animation "${N}"`)}
     ${a.story ? `<div class="doc">${md(a.story)}</div>` : `<p class="muted">Claude writes the story, splits every spoken line by character, and writes the art prompts.</p>`}`)}
  ${step(2, "Voiceovers by character", st("voice"),
    !a.lines.length ? `<p class="muted">The lines appear here after step 1.</p>` :
    `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
       <span class="muted">🎭 Character expression (Eleven v3):</span>
       <select style="width:auto" onchange="setExpression(this.value)">
         ${[["creative","Creative: most emotional, follows tags strongly"],["natural","Natural: balanced"],["robust","Robust: steady, less emotion"]]
           .map(([v,t]) => `<option value="${v}" ${(a.expression || "creative") === v ? "selected" : ""}>${t}</option>`).join("")}</select>
       <span class="muted" style="font-size:12px">Tags: [sighs] [laughs] [whispers] [excited] [sad] [angry] [gasps] [nervous laugh] [sarcastic]…</span></div>
     <p class="muted">🤖 Characters: pick an ElevenLabs voice and click Generate per line (saved automatically).
       🎙️ Narrator: upload your own recording, then ask Claude to cut it into lines:</p>
     ${promptBox(`Split the voiceovers for animation "${N}"`)}
     <div class="chars" style="margin-top:12px">${chars.map(charBox).join("")}</div>`)}
  ${step(3, "Art: characters, environments & props", st("art"),
    !a.prompts.length ? `<p class="muted">The image prompts appear here after step 1.</p>` :
    `<p class="muted">Generate each image with your AI image tool, upload it under its prompt, then ask Claude to cut them into pieces:</p>
     ${promptBox(`Cut the art sheets for animation "${N}"`)}
     ${copyAllBox(a)}
     <div class="arts" style="margin-top:12px">${a.prompts.map(artBox).join("")}</div>`)}
  ${step(4, "Build, animate & render", st("out"),
    `${a.rendering ? `<p style="color:var(--warn);font-weight:600">⏳ Rendering…</p>` : ""}
     ${promptBox(`Build and render the test scene (shots 1–6) for animation "${N}"`)}
     ${promptBox(`Build and render the full animation "${N}"`)}
     ${a.stills.length ? `<label>Style frames</label><div style="display:flex;gap:8px;overflow:auto">${a.stills.map(s => `<a href="${BASE}${s}" target="_blank"><img src="${BASE}${s}" style="height:160px;border-radius:6px"></a>`).join("")}</div>` : ""}
     ${a.outputs.slice().reverse().map(o => `<video controls preload="metadata" src="${BASE}${o.url}?t=${o.time}" style="${a.format === "9:16" ? "height:60vh" : "width:min(100%,900px)"}"></video>
       <p><a href="${BASE}${o.url}" download>⬇ ${esc(o.name)}</a> <span class="muted">${o.mb} MB</span></p>`).join("")}
     <p class="muted">When the final video is ready, publishing (captions, music, YouTube/TikTok, calendar) works like the Clips page.</p>`)}
  </div>`;
}
async function savePerf(line, performance){
  await api("/api/anim/line-update", {method: "POST", body: JSON.stringify({name: cur, line, performance})}); toast("Saved " + line); lastSig = ""; load();
}
async function setExpression(expression){
  await api("/api/anim/expression", {method: "POST", body: JSON.stringify({name: cur, expression})}); toast("Expression: " + expression); lastSig = ""; load();
}
async function setVoice(character, voice_id){
  await api("/api/anim/voice-set", {method: "POST", body: JSON.stringify({name: cur, character, voice_id})}); lastSig = ""; load();
}
async function ttsLine(id, chars, again, btn, hasVoice, character){
  if (!hasVoice) { alert(`Choose a voice for ${character} first (the dropdown above the lines).`); return; }
  if (again && !confirm(`Regenerate ${id}? This uses about ${chars} ElevenLabs credits again.`)) return;
  btn.disabled = true; btn.textContent = "⏳ Generating…";
  try { await api("/api/anim/tts", {method: "POST", body: JSON.stringify({name: cur, line: id})}); toast(id + " saved"); }
  catch(e) { btn.disabled = false; btn.textContent = "🎙️ Generate"; }
  lastSig = ""; load();
}
fetch(BASE + "/api/el/status").then(r => r.json()).then(j => { el = j; lastSig = ""; load(); }).catch(() => {});
load(); setInterval(load, 4000);
</script>
